name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool libltdl-dev pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev build-essential ccache
      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36
      - name: Build APK
        shell: bash
        run: |
          buildozer -v android debug 2>&1 | tee build.log
      - name: Show error
        if: failure()
        shell: bash
        run: |
          grep -n -B 70 "Command failed" build.log | head -100
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RGBPhone-apk
          path: bin/*.apk
